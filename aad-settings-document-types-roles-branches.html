<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · AAD Taxation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F18934;
  --orange-ink:#E46A11;
  --orange-soft:#FFF1E8;
  --ink:#181C1E;
  --slate:#475569;
  --mute:#64748B;
  --faint:#9BA6B7;
  --line:#EBEEF0;
  --line-soft:#F3F4F6;
  --field:#F3F4F6;
  --bg:#F7F8FA;
  --green:#059669;
  --green-soft:#ECFDF5;
  --red:#E11D48;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
ul{list-style:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= Shell ================= */
.shell{display:flex;min-height:100vh}

/* --- primary nav --- */
.nav{
  width:232px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.nav-logo{padding:22px 22px 26px}
.nav-logo img{height:56px;width:auto;max-width:100%;display:block}
.nav-items{padding:0 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-items a{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;
  color:#475569;font-weight:500;text-decoration:none;font-size:14.5px;
}
.nav-items a:hover{background:#F6F7F9;color:var(--ink)}
.nav-items a.on{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.nav-items a svg{flex-shrink:0;opacity:.9}
.nav-foot{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-foot a{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:13.5px}
.nav-foot a:hover{background:#F6F7F9;color:var(--ink)}

/* collapsed icon rail */
.nav{transition:width .18s}
body.collapsed .nav{width:76px}
body.collapsed .nav-logo{padding:22px 0 26px;display:flex;justify-content:center}
body.collapsed .nav-logo img{height:30px}
body.collapsed .nav-items,
body.collapsed .nav-foot{padding-left:10px;padding-right:10px}
body.collapsed .nav-items a,
body.collapsed .nav-foot a{justify-content:center;gap:0;font-size:0;padding-left:0;padding-right:0}
body.collapsed .nav-items a svg,
body.collapsed .nav-foot a svg{font-size:14px}

/* --- main --- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:62px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
}
.burger{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--slate)}
.burger:hover{background:#F2F4F7}
.topbar .spacer{flex:1}
.top-search{position:relative;width:300px}
.top-search input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:999px;
  background:#fff;padding:0 40px 0 16px;font-size:13.5px;
}
.top-search input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,137,52,.13)}
.top-search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--slate);position:relative}
.icon-btn:hover{background:#F2F4F7}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--orange);border:1.5px solid #fff}
.whoami{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:999px}
.whoami:hover{background:#F2F4F7}
.avatar{width:34px;height:34px;border-radius:50%;background:#DCE9F7;display:flex;align-items:center;justify-content:center;color:#2563A8;font-weight:700;font-size:13px}
.whoami .who{text-align:left;line-height:1.25}
.whoami .who b{display:block;font-size:13.5px;font-weight:600}
.whoami .who span{display:block;font-size:11.5px;color:var(--mute)}

.work{flex:1;display:flex;min-width:0}

/* --- settings sub-nav (category wise) --- */
.subnav{
  width:272px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  padding:24px 0 32px;overflow-y:auto;max-height:calc(100vh - 62px);position:sticky;top:62px;
}
.subnav h2{font-family:'Manrope';font-size:21px;font-weight:800;letter-spacing:-.4px;padding:0 22px 16px}
.subnav .group{padding:0 14px;margin-bottom:6px}
.group-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:9px 10px;color:#94A3B8;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
}
.group-head:hover{color:var(--slate)}
.group-head svg{transition:transform .18s}
.group.closed .group-head svg{transform:rotate(-90deg)}
.group.closed ul{display:none}
.group ul{display:flex;flex-direction:column;gap:1px}
.group li button{
  width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;
  color:#475569;font-size:14px;font-weight:500;text-align:left;
}
.group li button:hover{background:#F6F7F9;color:var(--ink)}
.group li button.on{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.group li button svg{flex-shrink:0;opacity:.85}

/* --- content --- */
.content{flex:1;min-width:0;padding:22px 32px 48px;overflow-x:auto}


.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 16px}
.page-head h1{font-family:'Manrope';font-size:22px;font-weight:800;letter-spacing:-.4px}

.btn-primary{
  background:var(--orange);color:#fff;border-radius:6px;padding:9px 18px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 1px 1px rgba(0,0,0,.05);
}
.btn-primary:hover{background:#DE7A27}
.btn-ghost{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--slate)}
.btn-ghost:hover{background:#F6F7F9}

/* --- filter bar --- */
.filterbar{
  background:#fff;border:1px solid var(--line-soft);border-radius:14px;
  padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:14px;flex-wrap:wrap;
}
.search{position:relative;width:332px;max-width:100%}
.search input{width:100%;height:42px;background:var(--field);border:1px solid var(--field);border-radius:8px;padding:0 16px 0 44px;font-size:14px;color:var(--slate)}
.search input::placeholder{color:#6B7280}
.search input:focus{outline:none;border-color:var(--orange);background:#fff}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#6B7280}
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filters .lbl{display:flex;align-items:center;gap:6px;color:#4B5563;font-size:14px}
.sel{position:relative}
.sel select{
  appearance:none;min-width:140px;height:42px;background:var(--field);border:1px solid var(--field);
  border-radius:8px;padding:0 38px 0 16px;font-size:14px;color:#4B5563;cursor:pointer;
}
.sel select:focus{outline:none;border-color:var(--orange);background:#fff}
.sel svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#6B7280;pointer-events:none}
.clearf{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--orange-ink);padding:6px 4px;white-space:nowrap;
}
.clearf:hover{text-decoration:underline}
.clearf[hidden]{display:none}

/* --- table --- */
.card{background:#fff;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:15px 24px;font-size:11px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--mute);white-space:nowrap;background:#fff;
}
thead th.c{text-align:center}
thead th.r{text-align:right}
tbody td{padding:14px 24px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px;color:var(--slate)}
tbody td.c{text-align:center}
tbody td.r{text-align:right}
tbody tr:hover{background:#FCFCFD}
.name{font-family:'Manrope';font-weight:600;color:var(--ink);font-size:14px}

.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:4px;font-size:12px;font-weight:500}
.pill.on{background:var(--green-soft);color:var(--green)}
.pill.off{background:#F5F5F5;color:#A1A1AA}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{padding:5px 9px;border-radius:3px;font-size:11px;background:#F5F5F5;color:#4C4C5C;white-space:nowrap}
.chip.hot{background:var(--orange-soft);color:var(--orange-ink)}
.chip.more{color:#EF8733;background:#F5F5F5;padding:3px 6px;font-size:10px;cursor:pointer}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#52525B;font-weight:500}
.state i{width:8px;height:8px;border-radius:50%;background:#10B981;display:block}
.state.no i{background:#FF5966}

.acts{display:inline-flex;gap:6px}
.act{
  width:28px;height:28px;border:1px solid #E5E7EB;border-radius:6px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--slate);
}
.act:hover{background:#F6F7F9;border-color:#D7DBE0;color:var(--ink)}
.act.danger:hover{background:#FEF2F2;border-color:#FECACA;color:var(--red)}

.tfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tfoot p{font-size:12px;color:var(--faint);font-weight:500}
.pager{display:flex;gap:5px}
.pager button{
  min-width:28px;height:28px;border:1px solid rgba(171,179,185,.3);border-radius:5px;background:#fff;
  font-family:'Manrope';font-size:11.5px;font-weight:700;color:#313A46;
  display:inline-flex;align-items:center;justify-content:center;padding:0 7px;
}
.pager button:hover:not([disabled]){background:#F6F7F9}
.pager button.on{background:#EF8733;border-color:#EF8733;color:#fff}
.pager button[disabled]{opacity:.45;cursor:not-allowed}

.empty{padding:56px 24px;text-align:center}
.empty h3{font-family:'Manrope';font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{color:var(--mute);font-size:13.5px;margin-bottom:18px}

/* ================= Drawer ================= */
.overlay.as-drawer{justify-content:flex-end;align-items:stretch;padding:0;overflow:hidden}
.drawer{
  background:#fff;width:100%;max-width:660px;height:100%;display:flex;flex-direction:column;
  box-shadow:-18px 0 50px rgba(15,23,42,.18);animation:slideIn .22s ease-out;
}
.drawer .modal-body{flex:1;overflow-y:auto}
@keyframes slideIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.name-link{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.name-link:hover .name{color:var(--orange-ink);text-decoration:underline;text-underline-offset:3px}
.dl{display:flex;flex-direction:column;gap:0;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.dl-row{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line-soft);align-items:center}
.dl-row:last-child{border-bottom:0}
.dl-row dt{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748B}
.dl-row dd{font-size:13.5px;color:var(--ink)}
.dmods{display:flex;flex-direction:column;gap:8px}
.dmod{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#F6F7F9;border-radius:8px;padding:10px 14px;font-size:13.5px;font-weight:600}
@media (max-width:600px){.dl-row{grid-template-columns:1fr;gap:6px}}

/* tooltip */
.tip{position:relative;display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px;color:#94A3B8;cursor:help;text-transform:none;letter-spacing:0}
.tip:hover,.tip:focus{color:var(--orange-ink);outline:none}
.tip .tipbox{
  position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  width:max-content;max-width:260px;background:#1F2937;color:#fff;font-size:12px;font-weight:500;line-height:1.45;
  padding:8px 11px;border-radius:7px;box-shadow:0 8px 20px rgba(15,23,42,.2);
  opacity:0;visibility:hidden;transition:opacity .14s;z-index:5;pointer-events:none;white-space:normal
}
.tip .tipbox::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1F2937}
.tip:hover .tipbox,.tip:focus .tipbox{opacity:1;visibility:visible}
.sect-head{display:flex;align-items:center}

/* detail drawer */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 32px;border-bottom:1px solid var(--line)}
.dhead .eyebrow{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#94A3B8;margin-bottom:6px}
.dhead h2{font-family:'Manrope';font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.25;word-break:break-word}
.dhead .x{color:var(--mute);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dhead .x:hover{background:#F2F4F7;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;background:#FAFBFC}
.stat dt{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#94A3B8;margin-bottom:8px}
.stat dd{font-size:14px;font-weight:600;color:var(--ink)}
.dsec{border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.dsec-h{padding:12px 16px;background:#FAFBFC;border-bottom:1px solid var(--line-soft);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748B;display:flex;justify-content:space-between;align-items:center}
.dsec-h small{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:#94A3B8}
.dsec-b{padding:14px 16px}
.dsec-b .muted{font-size:13px;color:#94A3B8}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px;font-weight:600}
.mrow:last-child{border-bottom:0}
.mrow .mname{display:flex;align-items:center;gap:10px}
.mrow .mdot{width:30px;height:30px;border-radius:8px;background:var(--orange-soft);color:var(--orange-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.mrow.off{color:#A1A1AA}
.mrow.off .mdot{background:#F2F4F7;color:#A1A1AA}
.slotlist{display:flex;flex-wrap:wrap;gap:8px}
.slotlist span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12.5px;color:var(--slate)}
.slotlist b{font-size:11px;color:#94A3B8;font-weight:700}
.dhead-meta{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:var(--slate)}
.dhead-meta>span{display:inline-flex;align-items:center;gap:7px}
.dhead-meta>span svg:first-child{color:var(--faint);flex-shrink:0}
.dhead-meta a{color:var(--ink);text-decoration:none}
.dhead-meta a:hover{color:var(--orange-ink)}
.dhead-meta .hmaps{display:inline-flex;align-items:center;gap:5px;color:var(--orange-ink);font-weight:600;margin-left:4px}
.dhead-meta .hmaps:hover{text-decoration:underline;text-underline-offset:2px}
.dhead-acts{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-edit{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--orange);color:var(--orange-ink);border-radius:8px;font-size:13px;font-weight:600;background:#fff}
.btn-edit:hover{background:var(--orange-soft)}
.dstatus{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.dstatus p{font-size:12px;color:#94A3B8;margin-top:3px}
.dstatus b{font-size:13.5px;font-weight:600}
@media (max-width:600px){.dhead{padding:20px}}

/* document type details (read-only view) */
.drawer.swap{animation:none}
.dhead.dt{align-items:flex-start;padding:28px 28px 24px}
.dhead.dt .eyebrow{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:#94A3B8;margin-bottom:6px}
.dhead.dt .ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.dhead.dt h2{color:var(--ink)}
.dhead.dt .dhead-acts{padding-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.on{background:var(--green-soft);color:var(--green)}
.badge.off{background:#F3F4F6;color:#71717A}
.dview{flex:1;overflow-y:auto;padding:8px 28px 28px}
.drow{display:flex;align-items:flex-start;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.drow:last-child{border-bottom:0}
.dicon{width:38px;height:38px;border-radius:10px;background:#F3F4F6;color:var(--slate);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dicon svg{width:18px;height:18px}
.dtext{min-width:0;flex:1;padding-top:1px}
.dtext h3{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.dtext p{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dtags span{border:1px solid var(--line);background:#F7F8FA;border-radius:6px;padding:3px 10px;font-size:12.5px;font-weight:500;color:var(--slate)}
.dacc{display:flex;flex-direction:column;gap:9px;margin-top:9px}
.dacc div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.dacc b{font-weight:500;color:var(--ink)}
.dacc .req svg{color:var(--orange-ink)}
.dacc .opt svg{color:#A1A1AA}
.dacc .na,.dacc .na b{color:#A1A1AA}
@media (max-width:600px){.dhead.dt{padding:20px 16px 18px}.dview{padding:4px 16px 20px}.dhead.dt .dhead-acts{padding-top:8px}}

/* ================= Branches ================= */
.blink{white-space:nowrap;background:none;border:0;padding:0;font-family:'Manrope';font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.blink:hover{color:var(--orange-ink);text-decoration:underline;text-underline-offset:3px}
.contact{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink)}
.contact span{display:inline-flex;align-items:center;gap:6px}
.copy{color:#A1A1AA;display:inline-flex;padding:2px;border-radius:4px;cursor:pointer;background:none;border:0}
.copy:hover{color:var(--orange-ink);background:var(--orange-soft)}
.type{display:inline-flex;padding:4px 9px;border-radius:4px;font-size:12px;font-weight:500}
.type.fr{background:var(--green-soft);color:var(--green)}
.type.st{background:#F2F4F7;color:#71717A}
.addr{color:var(--ink);font-size:13px;white-space:nowrap}
.seg-wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#F6F7F9;border-radius:10px;padding:14px 16px;flex-wrap:wrap}
.seg-wrap p{font-size:13px;color:var(--slate)}
.seg{display:inline-flex;background:#E9ECF0;border-radius:8px;padding:3px}
.seg button{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;color:var(--slate)}
.seg button.on{background:var(--orange);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bsec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#3F3F46}
.bsec svg{color:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

#bb .fin,#bb .selbox select{background:#fff;border:1px solid var(--line)}

/* Document type form: same white, bordered fields as the Branches and Roles forms */

/* branch detail tabs */

.ins{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px}

.pay.unpaid{background:#FFF1F2;color:#E11D48}
.pay.part{background:#FEF3C7;color:#B45309}

.st2.sent{background:#EFF6FF;color:#2563EB}

.av{width:32px;height:32px;border-radius:50%;background:var(--orange-soft);color:var(--orange-ink);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0}
.who2{display:flex;align-items:center;gap:10px}

.mcard{border:1px solid var(--line-soft);border-radius:10px;overflow:auto}
@media (max-width:700px){.ins{grid-template-columns:1fr 1fr}.ins .k:last-child{grid-column:1/-1}.btabs{padding:0 16px}}

/* ================= Modal ================= */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;
  z-index:100;overflow-y:auto;
}
.overlay.open{display:flex}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:672px;
  box-shadow:0 24px 60px rgba(15,23,42,.22);overflow:hidden;
}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 32px;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:'Manrope';font-size:21px;font-weight:800;letter-spacing:-.3px}
.modal-head button{color:var(--mute);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-head button:hover{background:#F2F4F7;color:var(--ink)}
.modal-body{padding:28px 32px;display:flex;flex-direction:column;gap:24px}

  padding:18px 32px;border-top:1px solid var(--line);background:#FBFBFC;

}

.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748B;margin-bottom:9px}
.fin{
  width:100%;height:48px;background:var(--field);border:1px solid var(--field);border-radius:8px;
  padding:0 16px;font-size:14px;
}
.fin:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(241,137,52,.12)}
.fin.bad{border-color:#F3A3A3;background:#FFF7F7}
.fnote{display:flex;align-items:center;gap:7px;font-size:12px;color:#94A3B8;margin-top:9px}
.fnote svg{flex-shrink:0}

.ferr{font-size:12px;color:var(--red);font-weight:600;display:none}
.ferr.show{display:block}

.stepper{display:flex;align-items:center;background:var(--field);border-radius:8px;overflow:hidden;width:106px;height:48px}

.stepper button:hover{background:#E8EAEE}
.stepper span{flex:1;text-align:center;font-size:16px;font-weight:600}
.step-hint{font-size:12px;color:#94A3B8}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.toggle{
  width:44px;height:24px;border-radius:999px;background:#D7DBE0;position:relative;flex-shrink:0;
  transition:background .16s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on{background:var(--orange)}
.toggle.on::after{transform:translateX(20px)}

.block{background:#FAFBFC;border:1px solid var(--line-soft);border-radius:10px;padding:16px}
.block-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.block-row b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.block-row span{display:block;font-size:12px;color:#94A3B8}

.formats{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.fmt{
  border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-size:13px;color:var(--slate);
  display:inline-flex;align-items:center;gap:8px;background:#fff;
}
.fmt.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.fmt-note{background:var(--field);border-radius:8px;padding:13px 16px;font-size:13px;color:#6B7280;margin-top:12px}

.modrow{
  background:#F6F7F9;border-radius:9px;padding:13px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;
}
.modrow .left{display:flex;align-items:center;gap:11px}
.cbox{
  width:20px;height:20px;border-radius:5px;border:1.5px solid #CBD5E1;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
}
.cbox.on{background:var(--orange);border-color:var(--orange)}
.cbox svg{display:none}
.cbox.on svg{display:block}
.modrow .right{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--orange-ink)}
.modrow.off .right{color:#B6BCC6}

.sect-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748B}
.sect-sub{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#94A3B8;margin-top:7px;margin-bottom:14px}

.confirm-body{padding:26px 28px}
.confirm-body .warn{width:44px;height:44px;border-radius:50%;background:#FEF2F2;color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.confirm-body h3{font-family:'Manrope';font-size:17px;font-weight:700;margin-bottom:7px}
.confirm-body p{font-size:13.5px;color:var(--mute);line-height:1.55}
.btn-danger{background:var(--red);color:#fff;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600}
.btn-danger:hover{background:#BE123C}

/* --- toast --- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:#101828;color:#fff;border-radius:9px;padding:12px 18px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;
  display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

}

}
.ftext:focus,.fin.plain:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,137,52,.12)}

.counter{display:block;text-align:right;font-size:11.5px;color:#9AA3B1;margin-top:6px}

.matrix{width:100%;border-collapse:collapse}
.matrix thead th{
  background:#F8F9FB;padding:14px 20px;text-align:left;font-size:11px;font-weight:700;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--mute);white-space:nowrap;
}

.cbox.sm{width:17px;height:17px;border-radius:4px}

.form-actions{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding-top:4px}

.confirm-type{margin-top:18px}
.confirm-type label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:8px}
.confirm-body strong{color:var(--ink);font-weight:700}

function filtersActive(){ return !!(state.q || state.fModule || state.fStatus || state.fType); }
function filterBar(opts){

    '<input type="search" id="q" placeholder="'+esc(opts.search||'Search by name')+'" value="'+esc(state.q)+'"></div><div class="filters">'+

  }
  h+='<span class="sel"><select id="f-status"><option value="">All Status</option>'+

  h+='<button class="clearf" id="clearf"'+(filtersActive()?'':' hidden')+'>'+I.close+'Clear filters</button>';

function pager(total){
  var pages=Math.max(1,Math.ceil(total/state.per));
  if(state.page>pages) state.page=pages;
  var from=total?((state.page-1)*state.per+1):0, to=Math.min(state.page*state.per,total);
  var h='<div class="tfoot"><p>Showing '+from+' to '+to+' of '+total+' entries</p><div class="pager">';
  h+='<button data-p="'+(state.page-1)+'"'+(state.page===1?' disabled':'')+' aria-label="Previous">‹</button>';
  for(var i=1;i<=pages;i++) h+='<button data-p="'+i+'" class="'+(i===state.page?'on':'')+'">'+i+'</button>';
  h+='<button data-p="'+(state.page+1)+'"'+(state.page===pages?' disabled':'')+' aria-label="Next">›</button>';
  return h+'</div></div>';
}
function wireChrome(){
  var q=document.getElementById('q');
  if(q) q.oninput=function(){ state.q=q.value; state.page=1; render(); var n=document.getElementById('q'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };
  var fm=document.getElementById('f-module'); if(fm) fm.onchange=function(){ state.fModule=fm.value; state.page=1; render(); };
  var ft=document.getElementById('f-type'); if(ft) ft.onchange=function(){ state.fType=ft.value; state.page=1; render(); };
  var fs=document.getElementById('f-status'); if(fs) fs.onchange=function(){ state.fStatus=fs.value; state.page=1; render(); };
  var cf=document.getElementById('clearf');
  if(cf) cf.onclick=function(){ state.q=''; state.fModule=''; state.fStatus=''; state.fType=''; state.page=1; render(); };
  content.querySelectorAll('.pager button[data-p]').forEach(function(b){
    b.onclick=function(){ state.page=+b.dataset.p; render(); };

}

/* ---------- Document Types (full CRUD) ---------- */
function filteredDocs(){
  return DOCS.filter(function(d){
    if(state.q && d.name.toLowerCase().indexOf(state.q.toLowerCase())<0) return false;
    if(state.fModule && !d.modules[state.fModule]) return false;
    if(state.fStatus==='active' && !d.active) return false;
    if(state.fStatus==='inactive' && d.active) return false;
    return true;
  });
}
function chipList(arr,hotFn){
  if(!arr.length) return '<span style="color:#94A3B8">--</span>';
  var shown=arr.slice(0,2), rest=arr.length-2;
  var h='<div class="chips">'+shown.map(function(v){
    return '<span class="chip'+(hotFn&&hotFn(v)?' hot':'')+'">'+esc(v)+'</span>';
  }).join('');
  if(rest>0) h+='<span class="chip more" title="'+esc(arr.join(', '))+'">+'+rest+'</span>';
  return h+'</div>';
}

function singular(n){

  return n;
}

    '<div class="modal sm" role="dialog" aria-modal="true">'+
      '<div class="confirm-body"><div class="warn">'+I.warn+'</div>'+

function colState(col){

}
function rowState(m){
  var on=0; PERM_COLS.forEach(function(c){ if(draftRole.perms[m][c[0]]) on++; });
  return on===0?'none':(on===PERM_COLS.length?'all':'some');
}

function closeModal(){ overlay._guard=null; overlay.classList.remove('open','as-drawer'); overlay.innerHTML=''; document.body.style.overflow=''; }
overlay.addEventListener('click',function(e){ if(e.target!==overlay) return; if(overlay._guard){ overlay._guard(); return; } closeModal(); });

function showDrawer(html,swap){
  overlay.classList.add('as-drawer'); showModal(html);
  if(swap){ var dr=overlay.querySelector('.drawer'); if(dr) dr.classList.add('swap'); }
}
function showModal(html){
  overlay.innerHTML=html; overlay.classList.add('open'); document.body.style.overflow='hidden';

/* fromDetail: opened from the details view, so Cancel and Save return there */
function docModal(id,fromDetail){
  var editing = id!=null;

  var d = src ? JSON.parse(JSON.stringify(src)) : {
    name:'', files:1, labels:[], expiry:true, formatsOn:false, formats:[],
    modules:{Staff:false,Client:false},
    required:{Staff:false,Client:false}, active:true
  };

  showDrawer(
    '<div class="drawer" role="dialog" aria-modal="true">'+
      '<div class="modal-head"><h2>'+(editing?'Edit Document Type':'Add Document Type')+'</h2><button data-close aria-label="Close">'+I.close+'</button></div>'+
      '<div class="modal-body" id="mb"></div>'+

       '<div class="stepper"><button id="f-dec" aria-label="Fewer files">'+I.minus+'</button><span id="f-val">'+d.files+'</span><button id="f-inc" aria-label="More files">'+I.plus+'</button></div>'+
       '<span class="step-hint">Minimum 1 file, recommended maximum 10</span></div></div>';

    /* file slot labels — only when more than one file */
    if(d.files>1){
      h+='<div><span class="flabel">File slot labels</span><div class="slots">';
      for(var i=0;i<d.files;i++){
        h+='<input class="fin slot" data-i="'+i+'" placeholder="Label '+(i+1)+'" value="'+esc(d.labels[i]||'')+'">';
      }
      h+='</div><span class="fnote">'+I.info+'Labels will appear above upload fields</span></div>';
    }

    /* supported formats */
    h+='<div><div class="block-row"><div class="sect-head"><span class="sect-title">Supported formats</span>'+tip('Turn on to limit which file formats this document type accepts.')+'</div>'+
       '<button class="toggle'+(d.formatsOn?' on':'')+'" id="t-formats" role="switch" aria-checked="'+d.formatsOn+'" aria-label="Limit supported formats"></button></div>';
    if(d.formatsOn){
      h+='<div class="formats">'+FORMATS.map(function(f){
        var on=d.formats.indexOf(f)>=0;
        return '<button class="fmt'+(on?' on':'')+'" data-fmt="'+f+'">'+(on?I.tick:'')+f+'</button>';
      }).join('')+'</div>';
      if(!d.formats.length) h+='<p class="fnote" style="color:#E11D48">'+I.info+'Select at least one format</p>';
    } else {
      h+='<p class="fmt-note">All file formats are currently accepted.</p>';
    }
    h+='</div>';

    /* expiry */
    h+='<div class="block"><div class="block-row"><div><b>Has expiry date</b><span>Show an expiry date field when this document is uploaded</span></div>'+
       '<button class="toggle'+(d.expiry?' on':'')+'" id="t-expiry" role="switch" aria-checked="'+d.expiry+'"></button></div></div>';

    /* modules */
    h+='<div><div class="sect-head" style="margin-bottom:14px"><span class="sect-title">Module assignments</span>'+tip('Assign this document type to modules and set whether it is required or optional.')+'</div>';

      var on=d.modules[m], req=d.required[m];
      h+='<div class="modrow'+(on?'':' off')+'">'+

       '<button class="toggle'+(d.active?' on':'')+'" id="t-active" role="switch" aria-checked="'+d.active+'"></button></span></div></div>';

    mb.innerHTML=h;
    wireModal();
  }

  function readName(){ var n=document.getElementById('d-name'); if(n) d.name=n.value; }
  function readSlots(){ mb.querySelectorAll('.slot').forEach(function(s){ d.labels[+s.dataset.i]=s.value; }); }

  function wireModal(){
    document.getElementById('f-dec').onclick=function(){ readName();readSlots(); if(d.files>1){d.files--;d.labels=d.labels.slice(0,d.files);} paint(); };

    document.getElementById('t-expiry').onclick=function(){ readName();readSlots(); d.expiry=!d.expiry; paint(); };

      };

      b.onclick=function(){ readName();readSlots(); var m=b.dataset.req; d.required[m]=!d.required[m]; paint(); };
    });
  }

  paint();

  document.getElementById('save').onclick=function(){
    readName(); readSlots();
    var nameEl=document.getElementById('d-name'), err=document.getElementById('e-name');
    var clash=DOCS.some(function(x){ return x.name.toLowerCase()===d.name.trim().toLowerCase() && x.id!==id; });
    if(!d.name.trim()){ err.textContent='Document name is required'; err.classList.add('show'); nameEl.classList.add('bad'); nameEl.focus(); return; }
    if(clash){ err.textContent='Document type already exists'; err.classList.add('show'); nameEl.classList.add('bad'); nameEl.focus(); return; }
    if(!MODULES.some(function(m){return d.modules[m];})){ toast('Select at least one module'); return; }
    if(d.formatsOn && !d.formats.length){ toast('Select at least one file format'); return; }
    d.name=d.name.trim();
    if(d.files>1) d.labels=d.labels.slice(0,d.files).map(function(l,i){ return (l||'').trim()||('Label '+(i+1)); });
    else d.labels=[];
    if(editing){ for(var k in d) src[k]=d[k]; toast('Document type updated'); }
    else { d.id=docSeq++; DOCS.unshift(d); toast('Document type added'); }
    render();
    if(fromDetail) docDetail(id,true); else closeModal();
  };
}

    var pay=pays[(Math.floor(i/6)+b.id)%3], pend=pay==='Paid'?0:pay==='Unpaid'?amt:Math.round(amt*0.25);
    var dt=new Date(now.getFullYear(), now.getMonth()-(i%6), 1+((i*5+b.id)%27));
    var paid=pay==='Paid';
    out.push({
      id:'SAL-'+(100+b.id*10+i),
      d:dt,
      date:String(dt.getDate()).padStart(2,'0')+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+dt.getFullYear(),
      time:['09:52 AM','11:15 AM','02:40 PM','04:05 PM','09:52 PM'][i%5],
      amt:amt, pend:pend, acc:ACCOUNTANTS[(i+b.id)%5], pay:pay,
      status:paid&&(i%2===0)?'Draft':'Sent'
    });
  }
  return out.sort(function(a,c){ return c.d-a.d; });
}
var MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthOptions(){
  var now=new Date(), out=[['this','This month'],['last','Last month']];
  for(var i=0;i<12;i++){
    var dt=new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push([dt.getFullYear()+'-'+dt.getMonth(), MONTH_NAMES[dt.getMonth()]+' '+dt.getFullYear()]);
  }
  return out;
}
function monthMatch(d,val){
  if(!val) return true;
  var now=new Date(), y, m;
  if(val==='this'){ y=now.getFullYear(); m=now.getMonth(); }
  else if(val==='last'){ var p=new Date(now.getFullYear(), now.getMonth()-1, 1); y=p.getFullYear(); m=p.getMonth(); }
  else { var bits=val.split('-'); y=+bits[0]; m=+bits[1]; }
  return d.getFullYear()===y && d.getMonth()===m;
}
function branchStaff(b){
  return STAFF_NAMES.slice(0,5+(b.id%4)).map(function(n,i){
    return {name:n,code:'KPG'+(1000+b.id*10+i),phone:(function(n){return '04'+n.slice(0,2)+' '+n.slice(2,5)+' '+n.slice(5,8);})(String(10000000+(b.id*7919+i*104729)%89999999).slice(0,8)),
      email:n.split(' ')[0].toLowerCase()+'@aadtax.com.au',role:ROLE_NAMES[(i+b.id)%5],active:(i+b.id)%5!==3};
  });
}
function money(n){ return '$'+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function branchDetail(id,tab){

  wireCopy(overlay.querySelector('.dhead-meta'));

  function sel(id,first,opts,val){
    return '<span class="sel"><select id="'+id+'"><option value="">'+first+'</option>'+opts.map(function(o){return '<option'+(val===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'+I.chev+'</span>';
  }
  function selv(id,first,pairs,val){
    return '<span class="sel"><select id="'+id+'"><option value="">'+first+'</option>'+
      pairs.map(function(o){return '<option value="'+o[0]+'"'+(val===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'+I.chev+'</span>';
  }
  function dirtyFilters(){ return ui.q!==UI0.q || ui.f1!==UI0.f1 || ui.f2!==UI0.f2 || ui.fm!==UI0.fm; }
  function clearBtn(){ return dirtyFilters() ? '<button class="clearf" id="tclear">'+I.close+'Clear filters</button>' : ''; }
  function searchBox(ph){ return '<div class="search">'+I.search+'<input type="search" id="tq" placeholder="'+ph+'" value="'+esc(ui.q)+'"></div>'; }

  function overview(){
    var sales=branchSales(b);

      if(ui.q && x.id.toLowerCase().indexOf(ui.q.toLowerCase())<0) return false;

    });

    var h='<div class="mini-bar">'+searchBox('Search by sale ID')+

      sel('tf1','All Accountants',ACCOUNTANTS,ui.f1)+

    var total=rows.reduce(function(a,x){return a+x.amt;},0), pend=rows.reduce(function(a,x){return a+x.pend;},0);
    var cnt={Paid:0,Unpaid:0,'Partially paid':0}; rows.forEach(function(x){cnt[x.pay]++;});
    var n=rows.length||1;
    var pct=function(k){ return Math.round(cnt[k]/n*100); };

    h+='<div class="ins">'+

      '<dl class="k"><dt>Pending amount</dt><dd>'+money(pend).replace('.00','')+'</dd></dl>'+
      '<dl class="k"><dt>Payment status</dt><dd style="font-size:13px;font-weight:500;font-family:inherit">'+
        '<div class="sbar">'+Object.keys(cnt).map(function(k){return '<span style="width:'+pct(k)+'%;background:'+cols[k]+'"></span>';}).join('')+'</div>'+
        '<div class="slegend">'+Object.keys(cnt).map(function(k){return '<span><i style="background:'+cols[k]+'"></i>'+k+' '+pct(k)+'%</span>';}).join('')+'</div></dd></dl>'+
    '</div>';

    h+='<div class="mcard"><table class="mtable"><thead><tr><th>Sale ID</th><th>Date</th><th>Amount</th><th>Pending</th><th>Accountant</th><th>Payment status</th><th>Status</th></tr></thead><tbody>';
    if(!rows.length) h+='<tr><td colspan="7" style="text-align:center;color:var(--mute);padding:28px">No records found.</td></tr>';
    rows.forEach(function(x){
      h+='<tr><td class="sid">'+x.id+'</td><td>'+x.date+'</td>'+
        '<td style="font-weight:600">'+money(x.amt)+'</td><td style="color:'+(x.pend?'#E11D48':'var(--ink)')+'">'+money(x.pend)+'</td><td>'+x.acc+'</td>'+
        '<td><span class="pay '+(x.pay==='Paid'?'paid':x.pay==='Unpaid'?'unpaid':'part')+'">'+x.pay+'</span></td>'+
        '<td><span class="st2 '+(x.status==='Sent'?'sent':'draft')+'">'+x.status+'</span></td></tr>';
    });
    return h+'</tbody></table></div>';

  function staff(){
    var list=branchStaff(b).filter(function(x){
      var q=ui.q.toLowerCase().replace(/\s/g,'');
      if(q && (x.name+x.phone+x.email).toLowerCase().replace(/\s/g,'').indexOf(q)<0) return false;
      if(ui.f1 && x.role!==ui.f1) return false;
      if(ui.f2==='Active' && !x.active) return false;
      if(ui.f2==='Inactive' && x.active) return false;

    });
    var h='<div class="mini-bar">'+searchBox('Search by name, email or phone')+'<span class="lbl">'+I.filter+'Filter By:</span>'+sel('tf1','All Roles',ROLE_NAMES,ui.f1)+sel('tf2','All Status',['Active','Inactive'],ui.f2)+clearBtn()+'</div>';
    h+='<div class="mcard"><table class="mtable"><thead><tr><th>Name</th><th>Contact info</th><th>Role</th><th>Status</th></tr></thead><tbody>';
    if(!list.length) h+='<tr><td colspan="4" style="text-align:center;color:var(--mute);padding:28px">No records found.</td></tr>';
    list.forEach(function(x){

        '<td><div class="contact"><span>'+esc(x.phone)+'<button class="copy" data-copy="'+esc(x.phone)+'" title="Copy phone">'+I.copy+'</button></span>'+
        '<span>'+esc(x.email)+'<button class="copy" data-copy="'+esc(x.email)+'" title="Copy email">'+I.copy+'</button></span></div></td>'+

  function details(){

    var h='';
    h+='<section class="dsec"><div class="dsec-h"><span style="display:flex;align-items:center;gap:8px">'+I.infoLg+'General information</span></div><dl class="bd-grid">'+
      '<div><dt>Phone number</dt><dd>'+esc(b.phone)+cp(b.phone)+'</dd></div>'+
      '<div><dt>Email address</dt><dd><a href="mailto:'+esc(b.email)+'">'+esc(b.email)+'</a>'+cp(b.email)+'</dd></div>'+
      '<div><dt>Branch type</dt><dd>'+esc(b.type)+'</dd></div>'+
      '<div><dt>Created on</dt><dd>'+esc(b.created||'--')+'</dd></div>'+
    '</dl></section>';
    h+='<section class="dsec"><div class="dsec-h"><span style="display:flex;align-items:center;gap:8px">'+I.bank+'Banking details</span></div><dl class="bd-grid">'+
      '<div><dt>Account name</dt><dd>'+esc(b.accName)+'</dd></div>'+
      '<div><dt>BSB number</dt><dd>'+esc(b.bsb)+'</dd></div>'+
      '<div><dt>Account number</dt><dd>'+esc(b.accNo)+'</dd></div>'+
    '</dl></section>';
    h+='<section class="dsec"><div class="dsec-h"><span style="display:flex;align-items:center;gap:8px">'+I.pin+'Location</span></div>'+
      '<div class="daddr">'+esc(b.address)+',<br>'+esc(b.suburb+' '+b.state+' '+b.postcode)+', Australia</div>'+
      '<div class="mapbox"><svg class="bg" viewBox="0 0 400 170" preserveAspectRatio="none" aria-hidden="true">'+
        '<rect width="400" height="170" fill="#EEF1EC"/><path d="M0 120 C80 100 150 140 230 115 S360 90 400 105 V170 H0Z" fill="#CFE3EF"/>'+
        '<g stroke="#fff" stroke-width="9"><path d="M0 60 L400 40"/><path d="M120 0 L170 170"/><path d="M290 0 L250 170"/></g>'+
        '<g stroke="#fff" stroke-width="4"><path d="M0 95 L400 75"/><path d="M40 0 L70 170"/><path d="M210 0 L215 170"/><path d="M350 0 L330 170"/></g>'+
        '<g stroke="#F5B971" stroke-width="3"><path d="M0 60 L400 40"/></g></svg>'+
        '<span class="mpin"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22s-7.5-6.4-7.5-12A7.5 7.5 0 0 1 19.5 10c0 5.6-7.5 12-7.5 12Z"/><circle cx="12" cy="10" r="2.8" fill="#fff"/></svg></span>'+
        (b.map?'<a class="mapbtn" href="'+esc(b.map)+'" target="_blank" rel="noopener">VIEW ON GOOGLE MAPS '+I.ext+'</a>':'')+
      '</div></section>';
    return h;
  }
  function paint(){
    overlay.querySelectorAll('[data-tab]').forEach(function(t){ var on=t.dataset.tab===tab; t.classList.toggle('on',on); t.setAttribute('aria-selected',on); });
    tb.innerHTML = tab==='staff'?staff():overview();
    wireCopy(tb);
    var q=document.getElementById('tq');
    if(q) q.oninput=function(){ ui.q=q.value; paint(); var n=document.getElementById('tq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };

    var m=document.getElementById('tfm'); if(m) m.onchange=function(){ ui.fm=m.value; paint(); };

  paint();
}

/* ---------- Document type detail drawer (read-only) ---------- */
function docDetail(id,swap){
  var d=DOCS.filter(function(x){return x.id===id;})[0]; if(!d) return;
  function row(icon,title,detail){
    return '<div class="drow"><span class="dicon" aria-hidden="true">'+icon+'</span><div class="dtext"><h3>'+title+'</h3>'+detail+'</div></div>';
  }
  function tags(arr){ return '<div class="dtags">'+arr.map(function(v){return '<span>'+esc(v)+'</span>';}).join('')+'</div>'; }

  var labels=d.labels.filter(function(l){return l&&l.trim();});
  var h='';
  h+=row(I.files, d.files+(d.files===1?' file':' files')+' per upload',
    labels.length?tags(labels):'<p>Single upload, no labels</p>');
  h+=row(I.file, 'Supported formats',
    d.formatsOn&&d.formats.length?tags(d.formats):'<p>All formats accepted</p>');
  h+=d.expiry
    ? row(I.cal,'Expiry date required','<p>An expiry date is captured when the document is uploaded</p>')
    : row(I.calOff,'No expiry date','<p>Nothing is asked on upload</p>');
  h+=row(I.users,'Module access','<div class="dacc">'+MODULES.map(function(m){
    if(!d.modules[m]) return '<div class="na"><span><b>'+m+'</b> · Not assigned</span></div>';
    return d.required[m]
      ? '<div class="req">'+I.checkCircle+'<span><b>'+m+'</b> · Required</span></div>'
      : '<div class="opt">'+I.dashCircle+'<span><b>'+m+'</b> · Optional</span></div>';
  }).join('')+'</div>');

  showDrawer(
    '<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt-title">'+
      '<div class="dhead dt"><div style="min-width:0"><div class="eyebrow">Document type</div>'+
        '<div class="ttl"><h2 id="dt-title">'+esc(d.name)+'</h2>'+
        '<span class="badge '+(d.active?'on':'off')+'">'+(d.active?'Active':'Inactive')+'</span></div></div>'+
      '<div class="dhead-acts"><button class="btn-edit" id="d-edit">'+I.edit+'Edit</button>'+
      '<button class="x" data-close aria-label="Close">'+I.close+'</button></div></div>'+
      '<div class="dview">'+h+'</div>'+
    '</div>',
    swap
  );
  document.getElementById('d-edit').onclick=function(){ docModal(id,true); };
}

/* ---------- Simple add/edit modal ---------- */
function simpleModal(item,id){
  var list=SIMPLE[item.key];
  var editing=id!=null;
  var row=editing?list.filter(function(r){return r.id===id;})[0]:{name:'',active:true};
  var draft={name:row.name,active:row.active};
  var label=singular(item.name);

  showModal(
    '<div class="modal sm" role="dialog" aria-modal="true">'+
      '<div class="modal-head"><h2>'+(editing?'Edit ':'Add ')+esc(label)+'</h2><button data-close aria-label="Close">'+I.close+'</button></div>'+
      '<div class="modal-body">'+
        '<div><label class="flabel" for="s-name">Name</label>'+
        '<input class="fin" id="s-name" placeholder="Enter '+esc(label.toLowerCase())+' name" value="'+esc(draft.name)+'">'+
        '<div class="frow"><span class="fnote">'+I.info+'Must be unique in this list</span><span class="ferr" id="s-err">Already exists</span></div></div>'+
        '<div class="block"><div class="block-row"><div><b>Status</b><span>Inactive entries cannot be selected elsewhere</span></div>'+
        '<button class="toggle'+(draft.active?' on':'')+'" id="s-active" role="switch" aria-checked="'+draft.active+'"></button></div></div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn-ghost" data-cancel>Cancel</button><button class="btn-primary" id="s-save" style="padding:10px 26px">'+(editing?'Save changes':'Submit')+'</button></div>'+
    '</div>'
  );

  var tg=document.getElementById('s-active');
  tg.onclick=function(){ draft.active=!draft.active; tg.classList.toggle('on',draft.active); tg.setAttribute('aria-checked',draft.active); };

  document.getElementById('s-save').onclick=function(){
    var el=document.getElementById('s-name'), err=document.getElementById('s-err');
    draft.name=el.value.trim();
    if(!draft.name){ err.textContent='Name is required'; err.classList.add('show'); el.classList.add('bad'); el.focus(); return; }
    if(list.some(function(r){ return r.name.toLowerCase()===draft.name.toLowerCase() && r.id!==id; })){
      err.textContent='Already exists'; err.classList.add('show'); el.classList.add('bad'); el.focus(); return;
    }
    if(editing){ row.name=draft.name; row.active=draft.active; toast(label+' updated'); }
    else {
      simpleSeq[item.key]=(simpleSeq[item.key]||Math.max.apply(null,list.map(function(r){return r.id;}).concat([0])))+1;
      list.unshift({id:simpleSeq[item.key],name:draft.name,active:draft.active});
      toast(label+' added');
    }
    closeModal(); render();
  };
}

/* ---------- Delete confirmation ---------- */
function confirmDelete(kind,id){
  var name = kind==='doc'
    ? DOCS.filter(function(d){return d.id===id;})[0].name
    : SIMPLE[kind].filter(function(r){return r.id===id;})[0].name;

  showModal(
    '<div class="modal sm" role="dialog" aria-modal="true">'+
      '<div class="confirm-body"><div class="warn">'+I.warn+'</div>'+
      '<h3>Delete “'+esc(name)+'”?</h3>'+
      '<p>This entry will be removed from the list. Records already using it keep their existing value.</p></div>'+
      '<div class="modal-foot"><button class="btn-ghost" data-cancel>Cancel</button><button class="btn-danger" id="yes">Delete</button></div>'+
    '</div>'
  );
  document.getElementById('yes').onclick=function(){
    if(kind==='doc'){ DOCS=DOCS.filter(function(d){return d.id!==id;}); }
    else { SIMPLE[kind]=SIMPLE[kind].filter(function(r){return r.id!==id;}); }
    closeModal(); render(); toast('“'+name+'” deleted');
  };
}
